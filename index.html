<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دفترچه یادداشت</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="content">
      <div class="container">
        <header class="app-head">
          <h1 id="section-title">📒 یادداشت‌ها</h1>
          <p class="subtitle">ذخیره‌ی خودکار در حافظه‌ی مرورگر</p>
        </header>

        <!-- انتخاب بخش (تب‌های افقی برای موبایل و دسکتاپ) -->
        <nav class="sections" id="sections"></nav>

        <div class="card">
          <!-- نمای لیست (برای همه‌ی بخش‌ها به‌جز عادت) -->
          <div id="list-view">
            <form id="form" class="add-form" autocomplete="off">
              <input type="text" id="note" placeholder="یادداشت جدید بنویس..." />
              <button type="submit" id="add-btn"><i class="fa-solid fa-plus"></i> افزودن</button>
            </form>

            <div class="toolbar">
              <span id="counter" class="counter">۰ یادداشت</span>
              <div class="filters">
                <button class="filter active" data-filter="all">همه</button>
                <button class="filter" data-filter="active">فعال</button>
                <button class="filter" data-filter="done">انجام‌شده</button>
              </div>
              <button id="clear-done" class="clear-btn">پاک‌کردن انجام‌شده‌ها</button>
            </div>

            <ul id="note-list" class="note-list"></ul>
            <p id="empty-state" class="empty-state">هنوز موردی نداری. اولین مورد را بنویس! ✍️</p>
          </div>

          <!-- نمای جدول تقویم عادت (فقط بخش «کنترل عادت») -->
          <div id="habit-view" style="display:none">
            <div class="week-nav">
              <button id="prev-week" class="week-btn"><i class="fa-solid fa-chevron-right"></i></button>
              <span id="week-label" class="week-label"></span>
              <button id="next-week" class="week-btn"><i class="fa-solid fa-chevron-left"></i></button>
              <button id="this-week" class="week-today">این هفته</button>
            </div>

            <form id="habit-form" class="add-form" autocomplete="off">
              <input type="text" id="habit-input" placeholder="یک عادت جدید بنویس (مثلاً: ورزش صبحگاهی)..." />
              <button type="submit"><i class="fa-solid fa-plus"></i> افزودن عادت</button>
            </form>

            <div class="table-wrap">
              <table id="habit-table" class="habit-table"></table>
            </div>
            <p id="habit-empty" class="empty-state">هنوز عادتی ثبت نکرده‌ای. اولین عادت را بنویس! 🌱</p>
          </div>
        </div>
      </div>
    </div>

    <!-- منوی سه‌بعدی تزئینی (روی دسکتاپ) — انتخابی -->
    <ul class="side-menu" id="side-menu">
      <li style="--i:6;--clr:#ffbf80"><a href="Goal-Of-Week/index.html"><span><i class="fa-solid fa-bullseye"></i></span>Goal Of Week</a></li>
      <li style="--i:5;--clr:#ffb366"><a href="#" data-section="main"><span><i class="fa-solid fa-list-check"></i></span>Main Task</a></li>
      <li style="--i:4;--clr:#ffa64d"><a href="#" data-section="habit"><span><i class="fa-solid fa-repeat"></i></span>Habit Control</a></li>
      <li style="--i:3;--clr:#ff9933"><a href="#" data-section="important"><span><i class="fa-solid fa-star"></i></span>Important</a></li>
      <li style="--i:2;--clr:#ff8c1a"><a href="#" data-section="joy"><span><i class="fa-solid fa-face-smile"></i></span>Joy Of Week</a></li>
      <li style="--i:1;--clr:#ff8000"><a href="#" data-section="improve"><span><i class="fa-solid fa-arrow-trend-up"></i></span>How To Improve?</a></li>
    </ul>

    <script src="script.js"></script>
  </body>
</html>
